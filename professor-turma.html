<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turma | Conectados na Verdade</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <link
      rel="preload"
      href="assets/data/site-data.example.json"
      as="fetch"
      crossorigin
    />
    <script src="assets/js/professor-turma-page.js" defer></script>
    <script src="assets/js/home-button.js" defer></script>
  </head>
  <body data-page="turma">
    <main class="page-shell">
      <section class="phone-frame">
        <div class="screen subject-screen">
          <div class="topbar">
            <a
              class="back"
              href="javascript:history.back()"
              aria-label="Voltar"
              >←</a
            >
            <div class="topbar-title">
              <strong data-teacher-topbar>Voltar</strong>
            </div>
          </div>
          <div data-teacher-content>
            <article class="teacher-bio" aria-live="polite">
              <p class="kicker">Turma</p>
              <h1>Carregando turma…</h1>
            </article>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal Planos de Valores -->
    <div id="modal-planos" class="custom-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal-planos-title">
      <div class="modal-backdrop"></div>
      <div class="modal-card" style="max-width: 440px; padding: 20px 16px; max-height: 90vh; overflow-y: auto;">
        <button class="modal-close" aria-label="Fechar">&times;</button>
        <div class="panel" style="margin-bottom: 12px; padding: 0; background: transparent; border: none; box-shadow: none;">
          <h3 id="modal-planos-title" style="margin: 4px 0 10px; color: var(--ink);">Plano de Matérias e Valores</h3>
          <p style="font-size: 13.5px; line-height: 1.45; color: var(--ink); text-align: left;">
            Confira abaixo a relação de matérias, carga horária, valores e promoções:
          </p>
        </div>
        <div style="margin: 12px 0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border: 1px solid rgba(143,95,53,0.2);">
          <a href="assets/img/plano-materias.png" target="_blank" rel="noopener noreferrer" title="Toque para ampliar">
            <img src="assets/img/plano-materias.png" alt="Plano de Matérias - Conectados na Verdade" style="width: 100%; height: auto; display: block;" />
          </a>
        </div>
        <a class="cta" href="assets/img/plano-materias.png" target="_blank" rel="noopener noreferrer" style="margin-top: 12px; text-decoration: none; text-align: center; display: block;">
          🔍 Abrir tabela em tamanho real
        </a>
      </div>
    </div>
  </body>
</html>
